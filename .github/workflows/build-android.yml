# BUILD APK DI GITHUB ACTIONS — gratis, memakai keystore EAS yang sama.
#
# Kenapa jalur ini: kuota build cloud EAS gratis habis tiap bulan, dan VPS
# produksi (3 GB RAM, berbagi dengan bot) bukan tempat menjalankan Gradle.
# Runner GitHub punya JDK + Android SDK terpasang dan RAM 7 GB. `eas build
# --local` TIDAK memakai kuota cloud, tapi tetap mengambil kredensial
# (keystore, google-services) dari EAS lewat EXPO_TOKEN — jadi APK-nya
# ditandatangani kunci yang sama dengan build cloud dan bisa menimpa app
# yang sudah terpasang.
#
# Rahasia yang dibutuhkan (repo → Settings → Secrets → Actions):
#   EXPO_TOKEN  — expo.dev → Account settings → Access tokens
name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profil:
        description: "pratinjau = APK untuk tautan unduhan · produksi = AAB untuk Google Play"
        type: choice
        default: pratinjau
        options: [pratinjau, produksi]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # untuk menerbitkan APK ke Release 'pratinjau'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm ci

      # Penjaga sumber jalan DULUAN: build 20 menit untuk kode yang penjaganya
      # merah adalah 20 menit yang dibuang.
      - name: Penjaga sumber
        run: npm run periksa

      # Gagal DENGAN NAMA, bukan 23 detik galat samar dari eas-cli. Rahasia yang
      # kosong adalah sebab paling umum run pertama merah.
      - name: Pastikan EXPO_TOKEN terpasang
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN belum dipasang. Repo → Settings → Secrets and variables → Actions → New repository secret, nama EXPO_TOKEN, isi token dari expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "akun token:"; npx --yes eas-cli@latest whoami
          echo "project yang dituju (pemilik harus polosan):"
          npx --yes eas-cli@latest project:info

      # Dua profil, satu alur. `pratinjau` = APK untuk tautan unduhan (push ke
      # main dan bawaan tombol Run). `produksi` = AAB untuk Google Play, cuma
      # lewat tombol Run: Play menolak APK, dan AAB dipecah Play jadi ~30 MB
      # per HP alih-alih 54 MB dua ABI sekaligus.
      - name: Tentukan profil
        id: profil
        run: |
          P="${{ github.event.inputs.profil || 'pratinjau' }}"
          if [ "$P" = "produksi" ]; then
            echo "profil=produksi" >> "$GITHUB_OUTPUT"; echo "berkas=AnalisMarket.aab" >> "$GITHUB_OUTPUT"
          else
            echo "profil=pratinjau" >> "$GITHUB_OUTPUT"; echo "berkas=AnalisMarket.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (eas --local, kredensial dari EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          EXPO_PUBLIC_KOMIT: ${{ github.sha }}
        run: |
          npx --yes eas-cli@latest build --platform android --profile "${{ steps.profil.outputs.profil }}" \
            --local --non-interactive --output "$GITHUB_WORKSPACE/${{ steps.profil.outputs.berkas }}"

      # Penjaga APK memeriksa artefak SUNGGUHAN: izin, skema, harga. AAB
      # diperiksa lewat APK yang ditarik `bundletool`? Belum — AAB cuma
      # diunggah sebagai artefak; penjaganya sudah berjalan di APK pratinjau
      # dari commit yang sama.
      - name: Penjaga APK
        if: steps.profil.outputs.profil == 'pratinjau'
        run: node skrip/periksa-apk.mjs "$GITHUB_WORKSPACE/AnalisMarket.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AnalisMarket-${{ steps.profil.outputs.profil }}-${{ github.sha }}
          path: ${{ steps.profil.outputs.berkas }}
          retention-days: 14

      # SATU rilis bergulir 'pratinjau': aset lama diganti, tautannya tetap.
      # Artefak Actions butuh token untuk diunduh; aset Release di repo publik
      # tidak — itu yang membuat VPS bisa menariknya tanpa kredensial GitHub.
      - name: Terbitkan ke Release 'pratinjau'
        if: github.event_name == 'push' && steps.profil.outputs.profil == 'pratinjau'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pratinjau --yes --cleanup-tag 2>/dev/null || true
          gh release create pratinjau AnalisMarket.apk --prerelease \
            --title "Pratinjau ${GITHUB_SHA::7}" \
            --notes "Build otomatis dari ${GITHUB_SHA}. Bukan rilis toko."
