<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semua Layar App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="semua.css">
<style>
/* ── layar masuk ── */
.masuk-latar{position:absolute;left:0;right:0;top:46px;height:420px;z-index:1;opacity:.85}
.masuk-latar::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,6,.15),rgba(8,7,6,.2) 55%,rgba(8,7,6,.95))}
.ml-tf{display:flex;gap:4px;padding:6px 16px}
.ml-tf span{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--samar);padding:6px 0;border-radius:9px}
.ml-tf span.on{background:rgba(255,236,206,.12);color:var(--text)}
.ml-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 16px 8px}
.sm-sel{border-radius:10px;padding:6px 7px;background:rgba(255,236,206,.05);box-shadow:inset 0 0 0 1px rgba(255,232,196,.07)}
.sm-sel b{display:block;font-family:var(--mono);font-size:10px;color:var(--text);font-weight:700}
.sm-sel em{font-style:normal;font-size:10px;color:var(--samar);display:flex;align-items:center;gap:4px;margin-top:3px}
.sm-sel em .dot{width:5px;height:5px;box-shadow:none}
.ml-chart{width:390px;height:380px;object-fit:cover;object-position:top;display:block;opacity:.9}
.masuk-kartu{position:absolute;left:12px;right:12px;bottom:14px;z-index:5;border-radius:30px;padding:20px 18px 16px}
.mk-merek{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.mk-merek img{width:28px;height:28px;border-radius:50%}
.mk-merek span{color:var(--amber)}
.masuk-kartu h1{font-size:25px;font-weight:600;letter-spacing:-.03em;line-height:1.12;margin-top:14px}
.masuk-kartu > p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.mk-kisi{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px;margin:16px 0 16px}
.mk-kisi div{display:grid;grid-template-columns:30px 1fr;column-gap:9px;row-gap:2px;align-items:start}
.mk-kisi .ik{width:30px;height:30px;border-radius:10px;grid-row:span 2}
.mk-kisi .ik svg{width:15px;height:15px}
.mk-kisi b{font-size:12.5px;font-weight:600}
.mk-kisi em{font-style:normal;font-size:10.5px;color:var(--samar);line-height:1.35}
.mk-kecil{font-size:11px;color:var(--samar);text-align:center;line-height:1.5;margin-top:12px}
svg.g{width:18px;height:18px}

/* ── langkah telegram ── */
.langkah{display:flex;gap:12px;padding:11px 0}
.langkah + .langkah{box-shadow:inset 0 1px 0 rgba(255,232,196,.07)}
.langkah .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--tinta);background:linear-gradient(180deg,#F0BF6B,#E1A645);flex:none}
.langkah b{font-size:13.5px;font-weight:600;display:block;line-height:1.35}
.langkah em{font-style:normal;font-size:11.5px;color:var(--samar);display:block;margin-top:3px;line-height:1.45}
.tempel{height:48px;border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:13px;color:var(--redup);font-family:var(--mono);letter-spacing:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(255,232,196,.12)}
.label-kecil{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--samar);margin:16px 2px 8px}
.garis-atau{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--samar);margin:16px 0 10px}
.garis-atau::before,.garis-atau::after{content:'';flex:1;height:1px;background:rgba(255,232,196,.09)}

/* ── home ── */
.hero{border-radius:26px;padding:16px 16px 14px}
.hero .b1{display:flex;align-items:center;gap:8px}
.hero .b1 b{font-size:15px;font-weight:600}
.hero .b1 .ket{margin-left:auto;font-size:9.5px;color:var(--samar)}
.harga-besar{font-size:40px;font-weight:600;letter-spacing:-.035em;margin-top:10px;line-height:1}
.harga-besar span{color:var(--muted);font-size:26px}
.ubah{font-size:13px;font-weight:600;margin-top:6px;display:flex;gap:8px;align-items:center}
.ubah em{font-style:normal;color:var(--samar);font-weight:500}
.keadaan{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:8px}
.keadaan span{margin-left:auto;color:var(--samar);font-weight:500;font-size:12px}
.tombol2{display:flex;gap:8px;margin-top:12px}
.tombol2 .btn.amber{flex:1}
.lanjut{display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 12px 10px 10px;margin-top:12px}
.thumb{position:relative;width:104px;height:58px;border-radius:11px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,232,196,.1)}
.thumb img{width:100%;height:100%;object-fit:cover}
.mini-putar{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.35))}
.mini-putar svg{width:22px;height:22px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.lanjut .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lanjut small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--amber)}
.lanjut b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:rgba(255,236,206,.1);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:2px}
.lanjut em{font-style:normal;font-size:11px;color:var(--samar)}
.pintu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pintu .p{border-radius:18px;padding:12px 11px 11px;height:86px;display:flex;flex-direction:column;position:relative}
.pintu .ik{width:32px;height:32px;border-radius:10px}
.pintu b{font-size:12.5px;font-weight:600;margin-top:auto;letter-spacing:-.01em}
.pintu em{font-style:normal;font-size:10.5px;color:var(--samar);margin-top:1px}
.pintu .am{position:absolute;top:10px;right:10px;font-size:9px;font-weight:700;color:var(--amber);letter-spacing:.04em}
.favorit{display:flex;gap:10px}
.fav{width:150px;flex:none;border-radius:18px;padding:12px}
.fav .f1{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.fav .fh{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
.fav .fu{font-size:11px;font-weight:600;margin-top:2px}
.fav .spark{margin-top:6px}

/* ── menu ── */
.akun-mini{display:flex;align-items:center;gap:12px;border-radius:22px;padding:14px}
.akun-mini .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.akun-mini b{font-size:16px;font-weight:600}
.akun-mini em{font-style:normal;font-size:12px;color:var(--muted)}
.merek-blok{border-radius:20px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.merek-blok .m1{display:flex;align-items:center;gap:10px}
.merek-blok .m1 img{width:30px;height:30px;border-radius:50%}
.merek-blok .m1 b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.merek-blok .m1 b span{color:var(--amber)}
.merek-blok .m1 em{display:block;font-style:normal;font-size:11px;color:var(--samar);font-weight:500;letter-spacing:0;margin-top:1px}
.data-masuk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.data-masuk div{border-radius:12px;padding:8px 10px;background:rgba(255,236,206,.04);box-shadow:inset 0 0 0 1px rgba(255,232,196,.06)}
.data-masuk small{display:block;font-size:10.5px;color:var(--samar)}
.data-masuk b{font-size:14px;font-weight:600}

/* ── kotak masuk ── */
.chips-baris{display:flex;gap:6px;padding:0 16px;position:relative;z-index:3;overflow:hidden}
.km{display:flex;gap:12px;padding:12px 14px;position:relative;align-items:flex-start}
.km + .km::before{content:'';position:absolute;top:0;left:60px;right:14px;height:1px;background:rgba(255,232,196,.07)}
.km .ik{margin-top:1px}
.km .tx{flex:1;min-width:0}
.km .j{display:flex;align-items:center;gap:6px}
.km .j b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km.dibaca .j b{font-weight:500;color:#DCD5CA}
.km p{font-size:12px;color:var(--samar);line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.km .kn{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.km .kn small{font-size:11px;color:var(--samar)}
.km .kn .baris-kn{display:flex;align-items:center;gap:6px}
.lbl-hari{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--samar);margin:14px 4px 8px}

/* ── pasar ── */
.pasar-kepala{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:4px 14px 10px}
.pil-pasar{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 6px 6px 8px}
.pil-pasar b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.pil-pasar .ganti{font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 9px;border-radius:999px;background:rgba(255,236,206,.08);display:flex;align-items:center;gap:3px}
.pil-pasar .ganti svg{width:12px;height:12px}
.pasar-kepala .hg{margin-left:auto;text-align:right}
.pasar-kepala .hg b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.pasar-kepala .hg em{font-style:normal;font-size:12px;font-weight:600}
.tf-baris{position:relative;z-index:3;display:flex;gap:3px;margin:0 14px;padding:4px;border-radius:14px}
.tf-baris span{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--samar);padding:7px 0;border-radius:10px}
.tf-baris span.on{background:rgba(255,236,206,.13);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,236,206,.14)}
.pita-mesin{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 14px 0}
.pm{border-radius:12px;padding:7px 8px 8px;background:rgba(255,236,206,.04);box-shadow:inset 0 0 0 1px rgba(255,232,196,.07);position:relative;overflow:hidden}
.pm b{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm em{font-style:normal;font-size:10.5px;color:var(--samar);display:flex;align-items:center;gap:4px;margin-top:4px;white-space:nowrap}
.pm em .dot{width:6px;height:6px}
.pm.on{background:linear-gradient(180deg,rgba(229,173,81,.16),rgba(229,173,81,.05));box-shadow:inset 0 0 0 1px rgba(229,173,81,.45)}
.pm.on::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--amber)}
.pm.setup em{color:#8FE7C6}
.chart-bingkai{position:relative;z-index:2;margin:8px 12px 0;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,232,196,.10),0 20px 40px -20px rgba(0,0,0,.9)}
.chart-bingkai img{display:block;width:100%}
.alat{position:relative;z-index:3;display:flex;gap:6px;padding:8px 14px 0;overflow:hidden}
.alat .chip{font-size:12px;padding:6px 11px}
.alat .chip.nyala{background:rgba(255,236,206,.14);color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,232,196,.16)}
.intip{position:absolute;left:12px;right:12px;bottom:96px;z-index:18;border-radius:24px;padding:8px 14px 12px}
.intip .pegangan{width:36px;height:4px;border-radius:2px;background:rgba(255,236,206,.25);margin:0 auto 8px}
.intip .r1{display:flex;align-items:center;gap:8px}
.intip .r1 small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--samar)}
.intip .r1 .chip{margin-left:auto}
.intip .r2{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.intip .r2 b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.intip .rencana{margin-top:10px}

/* ── lembar bacaan ── */
.lb-kepala{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lb-kepala small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--samar)}
.lb-kepala .tutup{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--amber)}
.kl{border-radius:20px;padding:14px;margin-bottom:10px;background:rgba(255,236,206,.045);box-shadow:inset 0 0 0 1px rgba(255,232,196,.08)}
.kl .kk{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kl .kk small{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--samar)}
.kl .kk span{font-size:12px;color:var(--muted);font-weight:600}
.status-besar{display:flex;align-items:center;gap:10px}
.status-besar b{font-size:22px;font-weight:600;letter-spacing:-.025em}
.arah{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:6px}
.arah.merah{color:#FF8FA2;background:rgba(244,63,94,.13)}
.arah.hijau{color:#6FE3B7;background:rgba(16,185,129,.13)}
.kl .alasan{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px}
.arahan{margin-top:12px;padding-top:12px;box-shadow:inset 0 1px 0 rgba(255,232,196,.07)}
.arahan small{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--amber)}
.arahan p{font-size:13px;line-height:1.5;margin-top:5px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0}
.kv + .kv{box-shadow:inset 0 1px 0 rgba(255,232,196,.06)}
.kv span{color:var(--samar)} .kv b{font-weight:600}
.zl{display:flex;align-items:center;gap:10px;padding:8px 0}
.zl + .zl{box-shadow:inset 0 1px 0 rgba(255,232,196,.06)}
.zl .zt{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(255,236,206,.08);flex:none}
.zl .zt.tekanan{color:#FF9DAE;background:rgba(244,63,94,.12)}
.zl .zt.dukungan{color:#7FE0BC;background:rgba(16,185,129,.12)}
.zl div{flex:1;min-width:0}
.zl b{font-size:13px;font-weight:600;display:block}
.zl em{font-style:normal;font-size:11.5px;color:var(--samar)}

/* ── banding ── */
.bd{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;margin-bottom:6px;background:rgba(255,236,206,.035);box-shadow:inset 0 0 0 1px rgba(255,232,196,.06)}
.bd.on{background:linear-gradient(180deg,rgba(229,173,81,.14),rgba(229,173,81,.04));box-shadow:inset 0 0 0 1px rgba(229,173,81,.4)}
.bd .nm{width:96px;flex:none}
.bd .nm b{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0}
.bd .nm em{display:block;font-style:normal;font-size:10.5px;color:var(--samar);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd .kol{flex:1;text-align:right}
.bd .kol.st-k{flex:1.5}
.bd .kol small{display:block;font-size:9.5px;color:var(--samar);font-family:var(--mono);letter-spacing:.1em}
.bd .kol b{font-size:13px;font-weight:600}
.sepakat{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;margin-top:4px}
.sepakat b{font-size:20px;font-weight:600}
.sepakat div{font-size:12px;color:var(--muted);line-height:1.4}

/* ── pilih pasar ── */
.pp{display:flex;align-items:center;gap:11px;padding:10px 4px}
.pp + .pp{box-shadow:inset 0 1px 0 rgba(255,232,196,.06)}
.pp .tx{flex:1;min-width:0}
.pp .tx b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.pp .tx em{font-style:normal;font-size:11.5px;color:var(--samar)}
.pp .hg{text-align:right}
.pp .hg b{display:block;font-size:13.5px;font-weight:600}
.pp .hg em{font-style:normal;font-size:11.5px;font-weight:600}
.pp.dibuka{margin:0 -8px;padding:10px 12px;border-radius:16px;background:rgba(229,173,81,.08);box-shadow:inset 0 0 0 1px rgba(229,173,81,.3)}

/* ── akademi ── */
.lanjutkan{border-radius:24px;overflow:hidden;padding:0}
.sampul{position:relative;height:200px;overflow:hidden}
.sampul img{width:100%;height:100%;object-fit:cover;display:block}
.sampul .gelap{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,6,0) 45%,rgba(8,7,6,.75))}
.putar-besar{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;
  background:rgba(20,16,11,.45);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,236,206,.28),0 10px 30px rgba(0,0,0,.5)}
.putar-besar svg{width:24px;height:24px;color:#fff;margin-left:3px}
.putar-besar.jeda svg{margin-left:0}
.lanjutkan .putar-besar{left:auto;top:auto;right:16px;bottom:24px;margin:0;width:52px;height:52px}
.jejak{position:absolute;left:12px;right:12px;bottom:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.jejak i{display:block;height:100%;border-radius:2px;background:var(--amber);box-shadow:0 0 10px rgba(229,173,81,.7)}
.sampul .sisa{position:absolute;right:12px;top:12px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px}
.lanjutkan .ket{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}
.lanjutkan .ket small{font-size:9.5px}
.lanjutkan .ket b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.lanjutkan .ket em{font-style:normal;font-size:12px;color:var(--samar)}
.akses{font-size:11px !important;font-weight:600;color:var(--amber) !important;padding:4px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--amberTepi)}
.jalur{position:relative;display:flex;flex-direction:column;gap:8px}
.jalur::before{content:'';position:absolute;left:33px;top:26px;bottom:26px;width:1.5px;background:linear-gradient(180deg,var(--amber),rgba(229,173,81,.30) 30%,rgba(255,236,206,.10) 60%);z-index:0}
.bab{position:relative;z-index:1;display:flex;align-items:center;gap:12px;border-radius:18px;padding:10px 12px 10px 14px;min-height:62px}
.simpul{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);background:#17130e;box-shadow:inset 0 0 0 1.5px rgba(229,173,81,.35)}
.simpul svg{width:16px;height:16px;color:var(--samar)}
.simpul.cincin{background:conic-gradient(var(--amber) calc(var(--p)*1%),rgba(255,236,206,.12) 0);box-shadow:none}
.simpul.cincin span{width:31px;height:31px;border-radius:50%;background:#1a150f;display:grid;place-items:center;color:var(--amber)}
.bab .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bab .tx b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bab .tx em{font-style:normal;font-size:11.5px;color:var(--samar);display:flex;align-items:center;gap:6px}
.segmen{display:flex;gap:3px;margin-top:3px}
.segmen i{flex:1;height:4px;border-radius:2px;background:rgba(255,236,206,.18)}
.segmen i.s{background:var(--amber)}
.segmen i.h{background:linear-gradient(90deg,var(--amber) var(--h,60%),rgba(255,236,206,.18) 0)}
.segmen i.g{background:none;box-shadow:inset 0 0 0 1px rgba(255,236,206,.16)}
.bab.kunci .tx b{color:#CFC7BB}
.bab.kunci{opacity:.82}
.vid{display:flex;align-items:center;gap:11px;padding:8px 12px 8px 8px;position:relative}
