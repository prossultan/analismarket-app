name: uji-android

# UJI UJUNG-KE-UJUNG DI EMULATOR ANDROID SUNGGUHAN.
#
# Server produksi tidak punya KVM, jadi emulator tidak bisa jalan di sana.
# Runner GitHub punya. Build profil `uji` (x86_64 saja, tembok masuk dibuka
# lewat EXPO_PUBLIC_TANPA_TEMBOK) dipasang ke emulator API 34, tab Pasar
# diketuk lewat pohon UI, dan prosesnya harus tetap hidup — persis titik
# crash 20 Sep yang lolos typecheck, tujuh penjaga, dan harness web.
#
# Berjalan di tiap push ke main. Kalau merah, artefaknya memuat potret dan
# logcat, jadi kegagalannya bisa dilihat, bukan ditebak.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uji-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm ci

      - name: Penjaga sumber
        run: npm run periksa

      - name: Pastikan EXPO_TOKEN terpasang
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::EXPO_TOKEN belum dipasang"; exit 1; fi

      - name: Build APK profil uji (x86_64, tembok masuk dibuka)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          EXPO_PUBLIC_KOMIT: ${{ github.sha }}
        run: |
          npx --yes eas-cli@latest build --platform android --profile uji \
            --local --non-interactive --output "$GITHUB_WORKSPACE/uji.apk"

      # KVM untuk emulator — runner Linux GitHub menyediakannya, tapi
      # perangkatnya milik root sampai aturan udev ini dipasang.
      - name: Nyalakan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash skrip/uji-emulator.sh "$GITHUB_WORKSPACE/uji.apk" "$GITHUB_WORKSPACE/uji-emulator"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uji-emulator-${{ github.sha }}
          path: uji-emulator/
          retention-days: 14
